<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-colour icon shown in Safari's Extensions settings. Same artwork as the app icon, edge to edge. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e3a"/>
      <stop offset="1" stop-color="#14151a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <g fill="#f5f6f8">
    <rect x="136" y="198" width="60" height="180" rx="16"/>
    <rect x="76" y="258" width="180" height="60" rx="16"/>
  </g>
  <circle cx="399" cy="249" r="38" fill="url(#accent)"/>
  <circle cx="325" cy="327" r="38" fill="url(#accent)"/>
  <rect x="76" y="116" width="360" height="25" rx="12.500" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="76" y="116" width="130" height="25" rx="12.500" fill="url(#accent)"/>
</svg>
